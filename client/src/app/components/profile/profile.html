<div class="d-flex align-items-center justify-content-center py-5 px-3">
  <div class="fab-card">
    <a routerLink="/">
      <img width="200" height="100" src="fabulari-logo.png" alt="logo">
    </a>
    <h2 class="fab-card__title fab-serif">Your profile</h2>

    <div class="fab-avatar-wrap">
      <div class="fab-avatar">
        <img *ngIf="avatarPreview" [src]="avatarPreview" alt="Profile photo" />
        <svg *ngIf="!avatarPreview" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/>
        </svg>
      </div>
      <button type="button" class="fab-avatar-badge" (click)="fileInput.click()" aria-label="Change profile photo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
      <input #fileInput type="file" accept="image/*" hidden (change)="onAvatarSelected($event)" />
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="firstName">First name</label>
        <input id="firstName" class="form-control fab-input" formControlName="firstName" />
      </div>

      <div class="mb-3">
        <label class="form-label" for="lastName">Last name</label>
        <input id="lastName" class="form-control fab-input" formControlName="lastName" />
      </div>

      <div class="mb-3">
        <label class="form-label" for="dob">Date of birth</label>
        <input id="dob" type="date" class="form-control fab-input" formControlName="dob" />
      </div>

      <div class="mb-4">
        <label class="form-label" for="email">Email address</label>
        <input id="email" type="email" class="form-control fab-input" formControlName="email" />
      </div>

      <button type="submit" class="btn-fab-dark w-100">Save changes</button>
    </form>

    <a routerLink="/change-password" class="fab-link-center">Change password</a>
  </div>
</div>
