<div class="d-flex align-items-center justify-content-center vh-100 px-3">
  <div class="fab-card">
    <a routerLink="/">
      <img width="200" height="100" src="fabulari-logo.png" alt="logo">
    </a>
    <h2 class="fab-card__title fab-serif">Change password</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="currentPassword">Current password</label>
        <div class="fab-input-group">
          <input id="currentPassword" [type]="showCurrent ? 'text' : 'password'"
                 class="form-control fab-input" formControlName="currentPassword" placeholder="Password" />
          <button type="button" class="fab-input-icon" (click)="toggle('current')" aria-label="Toggle password visibility">
            <svg *ngIf="!showCurrent" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showCurrent" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="newPassword">New password</label>
        <div class="fab-input-group">
          <input id="newPassword" [type]="showNew ? 'text' : 'password'"
                 class="form-control fab-input" formControlName="newPassword" placeholder="Create a new password" />
          <button type="button" class="fab-input-icon" (click)="toggle('new')" aria-label="Toggle password visibility">
            <svg *ngIf="!showNew" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showNew" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <div class="form-text text-danger" *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.errors?.['weakPassword']">
          Password must be at least 8 characters with 1 uppercase letter.
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="confirmNewPassword">Confirm new password</label>
        <div class="fab-input-group">
          <input id="confirmNewPassword" [type]="showConfirm ? 'text' : 'password'"
                 class="form-control fab-input" formControlName="confirmNewPassword" placeholder="Re-enter new password" />
          <button type="button" class="fab-input-icon" (click)="toggle('confirm')" aria-label="Toggle password visibility">
            <svg *ngIf="!showConfirm" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showConfirm" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <div class="form-text text-danger" *ngIf="form.get('confirmNewPassword')?.touched && form.errors?.['mismatch']">
          Passwords do not match.
        </div>
      </div>

      <button type="submit" class="btn-fab-dark w-100">Update password</button>
    </form>

    <a routerLink="/profile" class="fab-link-center">Back to profile</a>
  </div>
</div>
