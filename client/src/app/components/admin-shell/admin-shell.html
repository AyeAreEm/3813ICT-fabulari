<div class="fab-admin-shell">
  <header class="fab-admin-topbar">
    <a routerLink="/" class="text-decoration-none">
      <img width="100" height="50" src="fabulari-logo.png" alt="logo">
    </a>
    <a routerLink="/profile" class="text-decoration-none">
      <div class="fab-admin-topbar__user">
        <span class="fab-avatar-sm fab-avatar-sm--dark">SA</span>
        <div>
          <div class="fab-admin-topbar__name">Super Admin</div>
          <div class="fab-admin-topbar__sub">Fabulari Console</div>
        </div>
      </div>
    </a>
  </header>

  <div class="fab-admin-body">
    <aside class="fab-admin-sidebar">
      <nav class="fab-admin-nav">
        <a routerLink="/admin/create-requests" routerLinkActive="active" class="fab-admin-nav__item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          Create Group Requests
        </a>
        <a routerLink="/admin/delete-requests" routerLinkActive="active" class="fab-admin-nav__item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          Delete Group Requests
        </a>
        <a routerLink="/admin/ban-requests" routerLinkActive="active" class="fab-admin-nav__item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="18" y1="8" x2="23" y2="13"/><line x1="23" y1="8" x2="18" y2="13"/></svg>
          Ban Requests
        </a>
        <a routerLink="/admin/logs" routerLinkActive="active" class="fab-admin-nav__item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Logs
        </a>
      </nav>
    </aside>

    <main class="fab-admin-main">
      <ng-content></ng-content>
    </main>
  </div>
</div>
