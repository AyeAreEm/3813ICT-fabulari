<app-admin-shell>
  <div class="fab-admin-list-header">
    <div>
      <h2 class="fab-admin-list-title fab-serif">Audit Logs</h2>
      <span class="fab-admin-list-sub">Showing latest activity</span>
    </div>

    <div class="fab-search-box">
      <svg class="fab-search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
      </svg>
      <input
        type="text"
        class="fab-search-input"
        placeholder="Search by date, actor, or action..."
        [ngModel]="searchTerm()"
        (ngModelChange)="onSearchChange($event)"
      />
    </div>
  </div>

  <div class="fab-log-table">
    <div class="fab-log-row fab-log-row--head">
      <span>Date/Time</span>
      <span>Actor</span>
      <span>Action</span>
    </div>

    <div
      class="fab-log-row"
      *ngFor="let l of filteredLogs()"
      role="button"
    >
      <span>{{ l.dateTime | date:'yyyy-MM-dd h:mm a' }}</span>
      <span class="fw-bold">{{ l.actor }}</span>
      <span>{{ l.action }}</span>
    </div>

    <div class="fab-log-empty" *ngIf="filteredLogs().length === 0">
      No matching logs found.
    </div>
  </div>
</app-admin-shell>
