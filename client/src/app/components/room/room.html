<app-shell [groups]="myGroups()" [activeGroupId]="group().id ?? null" *ngIf="group() && activeRoom">
  <div class="fab-room-layout">
    <app-group-nav [groupId]="group().id" [rooms]="rooms" [activeRoomId]="activeRoom.id" [isGroupAdmin]="isGroupAdmin"></app-group-nav>

    <div class="fab-room-main">
      <div class="fab-room-header">
        <h2 class="fab-room-title"># {{ activeRoom.name }}</h2>
      </div>

      <div class="fab-room-messages">
        <div class="fab-message" *ngFor="let m of messages">
          <span class="fab-avatar-sm">{{ m.initials }}</span>
          <div>
            <div class="fab-message__meta">
              <span class="fab-message__author">{{ m.authorName }}</span>
              <span class="fab-message__time">{{ m.timestamp }}</span>
            </div>
            <p class="fab-message__text">{{ m.text }}</p>
          </div>
        </div>
      </div>

      <div class="fab-room-composer">
        <button type="button" class="fab-composer-icon" aria-label="Attach file" (click)="fileInput.click()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <input #fileInput type="file" hidden (change)="onFileSelected($event)" />
        <input class="fab-composer-input" [(ngModel)]="draft" placeholder="Message …" autocomplete="off" (keydown.enter)="sendMessage()" />
        <button type="button" class="fab-composer-send" aria-label="Send message" (click)="sendMessage()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
            <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
    </div>

    <aside class="fab-users-panel">
      <div class="fab-sidebar__label">Users in room ({{ members().length }})</div>
      <div class="fab-user-row" *ngFor="let m of members()">
        <div class="fab-user-name">{{ m.name }}</div>
        <div class="fab-user-role">{{ m.role }}</div>
      </div>
    </aside>
  </div>
</app-shell>
