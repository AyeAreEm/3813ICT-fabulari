<app-shell [groups]="myGroups()" [activeGroupId]="group().id ?? null" *ngIf="group()">
  <div class="fab-details-layout">
    <app-group-nav [groupId]="group().id" [rooms]="rooms" [activeRoomId]="null" [isGroupAdmin]="isGroupAdmin"></app-group-nav>

    <div class="fab-details-main">
      <div class="fab-details-card">
        <div class="d-flex justify-content-between align-items-start">
          <div class="d-flex align-items-center gap-2 mb-2">
            <span class="fab-badge">{{ group().ageRestriction }}</span>
            <span class="fab-group-card__count">{{ group().memberCount | number }} members</span>
          </div>
          <button *ngIf="isGroupAdmin" type="button" class="fab-icon-btn" (click)="openSettings()" aria-label="Group settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
        <h1 class="fab-serif fab-details-title">{{ group().name }}</h1>
        <p class="fab-details-desc">{{ group().description }}</p>
      </div>

      <h2 class="fab-serif fab-section-title">Group Members</h2>
      <div class="fab-member-row" *ngFor="let m of members()">
        <div class="d-flex align-items-center gap-3">
          <span class="fab-avatar-sm">{{ m.initials }}</span>
          <span class="fab-member-name">{{ m.name }}</span>
        </div>
        <span class="fab-role-badge" [class.fab-role-badge--admin]="m.role === 'Admin'">{{ m.role }}</span>
      </div>
    </div>
  </div>
</app-shell>

<app-modal *ngIf="showSettings" (closed)="closeSettings()" maxWidth="560px">
  <app-group-settings [group]="group()" [members]="members()" (closed)="closeSettings()"></app-group-settings>
</app-modal>
