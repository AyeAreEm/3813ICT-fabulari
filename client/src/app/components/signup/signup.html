<div class="d-flex align-items-center justify-content-center py-5 px-3">
  <div class="fab-card">
    <a routerLink="/">
      <img width="200" height="100" src="fabulari-logo.png" alt="logo">
    </a>
    <h2 class="fab-card__title fab-serif">Create your account</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="firstName">First name</label>
        <input id="firstName" class="form-control fab-input" formControlName="firstName" placeholder="Enter your first name" />
      </div>

      <div class="mb-3">
        <label class="form-label" for="lastName">Last name</label>
        <input id="lastName" class="form-control fab-input" formControlName="lastName" placeholder="Enter your last name" />
      </div>

      <div class="mb-3">
        <label class="form-label" for="dob">Date of birth</label>
        <input id="dob" type="date" class="form-control fab-input" formControlName="dob" />
      </div>

      <div class="mb-3">
        <label class="form-label" for="email">Email address</label>
        <input id="email" type="email" class="form-control fab-input" formControlName="email" placeholder="you@example.com" />
        <div class="form-text text-danger" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Enter a valid email address.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <div class="fab-input-group">
          <input id="password" [type]="showPassword ? 'text' : 'password'"
                 class="form-control fab-input" formControlName="password" placeholder="Create a password" />
          <button type="button" class="fab-input-icon" (click)="toggle('password')" aria-label="Toggle password visibility">
            <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <div class="form-text text-danger" *ngIf="form.get('password')?.touched && form.get('password')?.errors?.['weakPassword']">
          Password must be at least 8 characters with 1 uppercase letter.
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="confirmPassword">Confirm password</label>
        <div class="fab-input-group">
          <input id="confirmPassword" [type]="showConfirmPassword ? 'text' : 'password'"
                 class="form-control fab-input" formControlName="confirmPassword" placeholder="Re-enter your password" />
          <button type="button" class="fab-input-icon" (click)="toggle('confirm')" aria-label="Toggle confirm password visibility">
            <svg *ngIf="!showConfirmPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showConfirmPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <div class="form-text text-danger" *ngIf="form.get('confirmPassword')?.touched && form.errors?.['mismatch']">
          Passwords do not match.
        </div>
      </div>

      <button type="submit" class="btn-fab-dark w-100">Create account</button>
    </form>

    <p class="fab-card__footer">
      Already have an account? <a routerLink="/login">Log in</a>
    </p>
  </div>
</div>
